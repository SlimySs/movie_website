<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Watchlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo">Movies Website</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Search</a></li>
        <li><a href="watchlist.html">Watchlist</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Your Watchlist</h2>
    <div id="watchlist"></div>
  </main>

  <script src="js/script.js"></script>
  <script>
    const watchlistContainer = document.getElementById('watchlist');

    // Load watchlist when page loads
    window.onload = loadWatchlist;

    function loadWatchlist() {
      const watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];

      if (watchlist.length === 0) {
        watchlistContainer.innerHTML = '<p>No movies in your watchlist yet!</p>';
        return;
      }

      watchlistContainer.innerHTML = ''; // Clear existing content
      watchlist.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.classList.add('movie-card');
        movieCard.innerHTML = `
          <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}" />
          <div class="movie-info">
            <h3 class="movie-title">${movie.title}</h3>
            <button onclick="removeFromWatchlist(${movie.id})">❌ Remove</button>
          </div>
        `;
        watchlistContainer.appendChild(movieCard);
      });
    }

    function removeFromWatchlist(movieId) {
      let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];
      watchlist = watchlist.filter(movie => movie.id !== movieId); // Remove movie by id
      localStorage.setItem('watchlist', JSON.stringify(watchlist)); // Save to localStorage
      loadWatchlist(); // Refresh the watchlist UI
    }
  </script>
</body>
</html>
